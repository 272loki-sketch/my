# New-API Docker Compose Configuration
#
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# Current setup: SQLite single-node deployment for VPS.
# To use PostgreSQL or MySQL instead, see the commented sections below.
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-api-custom:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ../data:/data
      - ../logs:/app/logs
    env_file:
      - .env
    environment:
      # SQLite mode (current VPS setup): SQLITE_PATH is set in .env
      # --- PostgreSQL alternative: uncomment and comment out SQLite ---
      # - SQL_DSN=postgresql://root:CHANGE_ME@postgres:5432/new-api
      # --- MySQL alternative: uncomment and comment out the rest ---
      # - SQL_DSN=root:CHANGE_ME@tcp(mysql:3306)/new-api
      # --- Redis (optional, for multi-node / caching) ---
      # - REDIS_CONN_STRING=redis://:CHANGE_ME@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-vps-1
      - GODEBUG=http2client=0
      - STREAMING_TIMEOUT=300
    # --- Optional: enable depends_on if using postgres/redis below ---
    # depends_on:
    #   - redis
    #   - postgres
    # networks:
    #   - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o 'success' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- Redis service (optional, for multi-node deployment / caching) ---
